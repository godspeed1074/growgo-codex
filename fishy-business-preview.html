<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fishy Business · GrowGo Card Review</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: ui-rounded, "Avenir Next", Avenir, system-ui, sans-serif;
      color: #f9edbf;
      background:
        radial-gradient(circle at 50% -10%, #168c99 0%, transparent 34rem),
        linear-gradient(180deg, #073a57, #021a32 72%);
    }
    header { max-width: 1120px; margin: 0 auto; padding: 2rem 1rem 1.15rem; text-align: center; }
    h1 { margin: 0; font-size: clamp(2rem, 7vw, 3.35rem); letter-spacing: .045em; text-shadow: 0 3px 0 #04455d, 0 0 25px #64f9f0; }
    p { margin: .45rem 0 0; color: #bce6dc; }
    main { max-width: 1120px; margin: 0 auto; padding: .25rem 1rem 3rem; }
    .back { width: min(180px, 44vw); display: block; margin: .8rem auto 2rem; border-radius: 12%; box-shadow: 0 13px 35px rgba(0,0,0,.45); }
    .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: clamp(.65rem, 1.7vw, 1.2rem); }
    figure { min-width: 0; margin: 0; padding: .45rem; border: 1px solid rgba(124, 247, 238, .35); border-radius: 1.1rem; background: linear-gradient(145deg, rgba(13, 112, 133, .74), rgba(2, 35, 67, .9)); box-shadow: inset 0 1px rgba(255,255,255,.12), 0 8px 20px rgba(0,0,0,.2); }
    img { width: 100%; display: block; border-radius: .78rem; aspect-ratio: 2 / 3; object-fit: cover; background: #052b42; }
    figcaption { min-height: 2.2em; display: grid; place-items: center; padding: .42rem .08rem .08rem; text-align: center; font-weight: 800; font-size: clamp(.67rem, 1.7vw, .92rem); line-height: 1.08; letter-spacing: .025em; }
    @media (max-width: 640px) { header { padding-top: 1.25rem; } .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .75rem; } }
  </style>
</head>
<body>
  <header>
    <h1>Fishy Business</h1>
    <p>GrowGo collectible card review · 40-card set</p>
  </header>
  <main>
    <img class="back" src="assets/cards/fishy-business-card-back-v1.jpg" alt="Fishy Business card back">
    <section class="grid" id="cards" aria-label="Fishy Business card fronts"></section>
  </main>
  <script>
    const cards = [
      ["Blue Tang", "blue-tang"], ["Clownfish", "clownfish"], ["Yellow Tang", "yellow-tang"], ["Angelfish", "angelfish"],
      ["Butterflyfish", "butterflyfish"], ["Moorish Idol", "moorish-idol"], ["Royal Gramma", "royal-gramma"], ["Neon Tetra", "neon-tetra"],
      ["Cardinal Tetra", "cardinal-tetra"], ["Guppy", "guppy"], ["Betta", "betta"], ["Discus", "discus"],
      ["Rainbowfish", "rainbowfish"], ["Mandarinfish", "mandarinfish"], ["Seahorse", "seahorse"], ["Lionfish", "lionfish"],
      ["Pufferfish", "pufferfish"], ["Triggerfish", "triggerfish"], ["Surgeonfish", "surgeonfish"], ["Damselfish", "damselfish"],
      ["Goby", "goby"], ["Blenny", "blenny"], ["Wrasse", "wrasse"], ["Parrotfish", "parrotfish"],
      ["Barracuda", "barracuda"], ["Mackerel", "mackerel"], ["Tuna", "tuna"], ["Salmon", "salmon"],
      ["Trout", "trout"], ["Catfish", "catfish"], ["Koi", "koi"], ["Goldfish", "goldfish"],
      ["Stingray", "stingray"], ["Electric Eel", "electric-eel"], ["Moray Eel", "moray-eel"], ["Hammerhead Shark", "hammerhead-shark"],
      ["Whale Shark", "whale-shark"], ["Manta Ray", "manta-ray"], ["Coelacanth", "coelacanth"], ["Oarfish", "oarfish"]
    ];
    document.getElementById("cards").innerHTML = cards.map(([name, slug], index) => `
      <figure>
        <img loading="lazy" src="assets/cards/fish-${String(index + 1).padStart(3, "0")}-${slug}-v${index === 15 ? 2 : 1}.jpg" alt="${name} card">
        <figcaption>${String(index + 1).padStart(2, "0")} · ${name}</figcaption>
      </figure>`).join("");
  </script>
</body>
</html>
